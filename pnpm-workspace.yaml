# pnpm 依赖布局：isolated（pnpm 默认）—— 顶层 node_modules 只放 package.json 声明过的包，
# 每个依赖只在它自己目录下链它声明的依赖。
#
# 【为什么不是原先记的 hoisted】10-02 那次骨架提交（`3dfdffd`，v0.1.0）的「踩坑 3」写着
# 「isolated 在本机出现半成品 node_modules（非 scoped 全缺、状态文件还标完成）」，
# 于是 `nodeLinker: hoisted` 被当成**长期状态**记进 PLAYBOOK §3。那句话没有复现物证，
# 而同一次提交的「踩坑 1」对 rolldown 病因的诊断后来已被实测推翻（真因是叶子文件的裸类型导入，
# TS1484 335 处 / TS1205 0 处，见下面 overrides 那段）—— 所以这条同样不能当事实。
# 2026-10-12 干净重测（pnpm 12.8.1 / Node 24，与 10-02 同版本）：仓库外空目录只放
# package.json + pnpm-lock.yaml 装 isolated，11.2s 退出 0，**46 个声明过的直接依赖逐条查到有链接、
# 一个不缺**（判据是 `node_modules/<名>/package.json` 读得开，不是数目录条目 —— @types/* 与
# ESM-only 包用 require.resolve 会误报缺件）。防线② ④ 随后实跑 `createApp().use(Antd)` 注册 139 个名字。
# 顺带订正 README 那条警告：`@ant-design/fast-color` 是 antdv-next 自己 dependencies 里声明过的
# （^3.0.1），顶层没有它、但由 antdv-next 目录内照常解析得到，「改回 isolated 就 ERR_MODULE_NOT_FOUND」不成立。
#
# 【这一档的真正用处】isolated 会把「import 了但没声明」的幽灵依赖当场照出来。
# 本仓历史上那两起（§4 的 tinyexec、§11 的 dayjs）在 hoisted 下都是静默蒙对的。
# 2026-10-12 全仓预检：src + packages + scripts 共 668 个文件，零处未声明裸包名 import，
# 只有 `check-dead-props.mjs` 里一处 `createRequire` 动态 require 的 `@vue/compiler-sfc`（已改成
# `vue/compiler-sfc`）—— 那条静态扫描看不见，被这一档当场报出来了。
#
# 【换布局那一次必须整树重装】就地换（不 purge）+ 并行会话同时在装东西，会留下顶层缺链接的空档，
# 而 pnpm 的状态文件只管「跟上次一样不一样」，普通 `install` 这时会答 "Already up to date" 而不去补。
# 认出来的办法是逐条查链接，修法是一条命令：`pnpm install --force`（2026-10-12 实测 38.8s 补齐）。
nodeLinker: isolated

overrides:
  # Vite 8 = rolldown + oxc 内核。WXT 0.21.4 的 peerDeps 允许 `^6.3.4 || ^7.0.0 || ^8.0.0-0`，
  # 本行自 v0.5.15 起由 ^7.0.0（rollup 内核）翻到 ^8.0.0。回滚 = 把本行改回 ^7.0.0 并重装依赖。
  #
  # 【为什么曾经钉 v7】rolldown 会把「运行时 import 了一个只存在于类型层面的名字」判为
  # missing export 硬错误。真实病因不是原先注释说的 barrel 重导出，而是**叶子文件自己的裸类型
  # 导入**：在 v0.5.13 树上用 TypeScript 自身诊断量得 TS1484 共 335 处 / 85 文件
  # （downloader/entity 100、site/definitions 96、src/options 31、social·mediaServer·
  # backupServer 的 entity 67、site/schemas 14），而 TS1205（桶文件用值语法重导出纯类型）
  # 实测 **0 处**。这 335 处已全部补 `import type`，根 tsconfig 的 `verbatimModuleSyntax`
  # 也改回 true 固化防线（否则下次还会写回裸导入）。
  #
  # 【升级前的实测依据】对照构建用隔离副本做（同代码、只翻本行）：
  #   vite 8.3.2 + rolldown 1.2.12 → 构建 0 error / 0 missing export；耗时 5.5s（v7 37s）；
  #   产物 14.22MB / 1235 文件（v7 15.59MB / 1151）；SW 冒烟 PASS（module 形态、12 类事件注册）；
  #   317 个站点定义仍是「每站一个懒加载 chunk」；content-app 的 ESM 拆分仍生效。
  #   CJS interop 写法由 `r.AES.decrypt()` 变为 `a.default.AES.decrypt()`，已读 rolldown-runtime
  #   的 interop 助手确认：目标非 __esModule 或无自身 default 时它总会显式定义 default 指向整个
  #   命名空间，故结构自洽（crypto-js / sizzle / bencode / file-saver / jszip 走的都是同一助手）。
  #
  # 【遗留待人工回归】静态与构建覆盖不了的四条链路：站点解析 / 添加下载器 / CookieCloud 备份 /
  # content 弹窗。另：Lightning CSS 会新增 3 条 `:deep` 伪类警告，那是 SetBase 非 scoped 样式块
  # 里的死 CSS（v7 产物同样原样保留、浏览器同样不生效），不是本次升级引入的回归。
  vite: ^8.0.0

# pnpm 12 起不再自动执行依赖的构建脚本，未列入白名单会整体报
# ERR_PNPM_IGNORED_BUILDS 并以退出码 1 失败 —— 本地和 CI 都会挂。
# 键名注意：旧版是 onlyBuiltDependencies，pnpm 12 改为 allowBuilds；
# `pnpm config get only-built-dependencies` 仍能读到旧键，但不会被采纳（静默失效）。
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
